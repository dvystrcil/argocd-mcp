# Read-only ArgoCD API token for the argocd-mcp MCP server (homelab#815).
# Same flat-root InfisicalSecret shape as kroger-mcp/base/infisical-secret.yaml.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-mcp-infisical-secret
  namespace: argocd-mcp
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-bz-gt
        recursive: false
        secretsPath: /
  hostAPI: https://infisical.sirddail.net/api
  managedSecretReference:
    creationPolicy: Owner
    secretName: argocd-mcp-secrets
    secretNamespace: argocd-mcp
    secretType: Opaque
    template:
      data:
        ARGOCD_BASE_URL: '{{ .ARGOCD_MCP_BASE_URL.Value }}'
        ARGOCD_API_TOKEN: '{{ .ARGOCD_MCP_TOKEN.Value }}'
      includeAllSecrets: false
  resyncInterval: 60
